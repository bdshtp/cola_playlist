name: Update Cola Playlist

on:
  schedule:
    - cron: "*/30 * * * *"   # chạy mỗi 30 phút
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: python cola.py

      - name: Commit and push updated m3u
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cola.m3u
          git commit -m "Update Cola playlist" || echo "No changes to commit"
          git push
